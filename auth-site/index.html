<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasteCraft - Authentication</title>
    <meta name="description" content="PasteCraft password reset and authentication callback">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 650px;
            width: 100%;
            padding: 60px 50px;
            text-align: center;
            animation: slideUp 0.4s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        h1 {
            color: #1a202c;
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .subtitle {
            color: #718096;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .status {
            font-size: 17px;
            color: #4a5568;
            margin: 25px 0;
            line-height: 1.7;
        }
        
        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-radius: 50%;
            border-top: 4px solid #667eea;
            width: 60px;
            height: 60px;
            animation: spin 0.8s linear infinite;
            margin: 30px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            padding: 25px;
            border-radius: 16px;
            margin: 25px 0;
            font-weight: 600;
            font-size: 18px;
            border: 2px solid #b1dfbb;
        }
        
        .error {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            padding: 25px;
            border-radius: 16px;
            margin: 25px 0;
            font-weight: 600;
            font-size: 18px;
            border: 2px solid #f1b0b7;
        }
        
        .instructions {
            background: #edf2f7;
            border-left: 5px solid #667eea;
            padding: 25px 30px;
            margin: 30px 0;
            text-align: left;
            border-radius: 12px;
        }
        
        .instructions strong {
            color: #667eea;
            font-size: 18px;
            display: block;
            margin-bottom: 15px;
        }
        
        .instructions ol {
            margin-left: 25px;
            margin-top: 15px;
            line-height: 2.2;
            color: #2d3748;
        }
        
        .instructions li {
            margin: 8px 0;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 36px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 600;
            margin: 12px 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: inline-block;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .warning-box {
            background: #fef5e7;
            border: 2px solid #f39c12;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            color: #7d6608;
            font-size: 15px;
            text-align: left;
        }
        
        .info-box {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            color: #0d47a1;
            font-size: 15px;
        }
        
        .extension-badge {
            display: inline-block;
            background: #f7fafc;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #667eea;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
        }
        
        footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
            color: #a0aec0;
            font-size: 14px;
        }
        
        footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📋</div>
        <h1 id="title">PasteCraft Authentication</h1>
        <p class="subtitle" id="subtitle">Securely connecting to your extension...</p>
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status"></div>
        <div id="content"></div>
        
        <footer>
            <p>Powered by <strong>PasteCraft</strong></p>
            <p style="margin-top: 8px; font-size: 13px;">
                Need help? Check your extension or <a href="mailto:support@pastecraft.com">contact support</a>
            </p>
        </footer>
    </div>
    
    <script>
        const EXTENSION_ID = 'nkmpfhkinojohffdichlonlipfhgbobh';
        const searchParams = new URLSearchParams(window.location.search || '');
        const state = searchParams.get('state') || '';
        
        // Get hash parameters from URL
        const hash = window.location.hash;
        const params = new URLSearchParams(hash.substring(1));
        const access_token = params.get('access_token');
        const refresh_token = params.get('refresh_token');
        const type = params.get('type');
        const error_description = params.get('error_description');
        
        const spinner = document.getElementById('spinner');
        const status = document.getElementById('status');
        const content = document.getElementById('content');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');

        function createElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) element.className = className;
            if (text !== undefined) element.textContent = text;
            return element;
        }

        function createOpenExtensionButton(label) {
            const button = createElement('button', 'btn', label);
            button.type = 'button';
            button.addEventListener('click', openExtension);
            return button;
        }

        function setContent(...nodes) {
            content.replaceChildren(...nodes);
        }
        
        console.log('🔐 PasteCraft Callback Page Loaded');
        console.log('📦 Parameters:', { type, has_token: !!access_token, error: error_description });
        
        if (type === 'recovery' && access_token) {
            const nextUrl = `https://pastecraft.com/reset-password${window.location.hash}`;
            window.location.replace(nextUrl);
        } else if (error_description) {
            // Error in callback
            handleError(error_description);
        } else if (access_token) {
            // OAuth sign-in flow
            handleOAuthSignIn(access_token, refresh_token);
        } else {
            // No valid parameters
            handleInvalidLink();
        }
        
        function handleError(error) {
            spinner.style.display = 'none';
            title.textContent = '❌ Authentication Error';
            subtitle.textContent = 'Something went wrong';
            setContent(
                createElement('div', 'error', error),
                createElement('p', 'status', 'Please try again or contact support if the issue persists.')
            );
        }
        
        function handlePasswordReset(accessToken, refreshToken) {
            spinner.style.display = 'none';
            title.textContent = '🔐 Password Reset Ready';
            subtitle.textContent = 'Your reset link has been verified successfully';

            const instructions = createElement('div', 'instructions');
            const instructionsTitle = document.createElement('strong');
            instructionsTitle.textContent = '📋 Complete Your Password Reset:';
            const steps = document.createElement('ol');
            [
                'Click the PasteCraft extension icon 📋 in your browser toolbar',
                'The password reset form will appear automatically',
                'Enter your new password (must be strong & secure)',
                'Click "Update Password" to complete'
            ].forEach((step) => steps.appendChild(createElement('li', '', step)));
            instructions.append(instructionsTitle, steps);

            const warning = createElement('div', 'warning-box');
            const warningTitle = document.createElement('strong');
            warningTitle.textContent = '⏰ Important: ';
            warning.append(warningTitle, 'This reset link expires in 1 hour. Complete your password reset soon. Keep this tab open until you\'re done.');

            const tip = createElement('div', 'info-box');
            tip.style.marginTop = '30px';
            const tipTitle = document.createElement('strong');
            tipTitle.textContent = '💡 Tip: ';
            tip.append(tipTitle, 'If the extension doesn\'t open automatically, look for the PasteCraft icon 📋 in your browser\'s extension toolbar (usually top-right corner).');

            setContent(
                createElement('div', 'success', '✅ Authentication verified!'),
                instructions,
                warning,
                createOpenExtensionButton('🚀 Open PasteCraft Extension'),
                tip
            );

            // Try to communicate with extension only if state is present (nonce gating).
            if (state) {
                tryExtensionMessage({ type: 'password_reset', access_token: accessToken, refresh_token: refreshToken, state });
            }
        }
        
        function handleOAuthSignIn(accessToken, refreshToken) {
            spinner.style.display = 'none';
            title.textContent = '✅ Sign In Successful';
            subtitle.textContent = 'Welcome to PasteCraft!';

            const instructions = createElement('div', 'instructions');
            const instructionsTitle = document.createElement('strong');
            instructionsTitle.textContent = '📋 Next Steps:';
            const steps = document.createElement('ol');
            [
                'Click the PasteCraft extension icon in your browser',
                'Start using PasteCraft features',
                'You can close this tab'
            ].forEach((step) => steps.appendChild(createElement('li', '', step)));
            instructions.append(instructionsTitle, steps);

            setContent(
                createElement('div', 'success', 'You\'ve been signed in successfully!'),
                instructions,
                createOpenExtensionButton('🚀 Open PasteCraft')
            );
            
            // Try to communicate with extension
            tryExtensionMessage({ type: 'oauth_signin', access_token: accessToken, refresh_token: refreshToken });
            
            // Auto-close after delay
            setTimeout(() => {
                const closeNotice = createElement('p', '', 'This tab will close automatically in 5 seconds...');
                closeNotice.style.marginTop = '20px';
                closeNotice.style.color = '#718096';
                content.appendChild(closeNotice);
                setTimeout(() => window.close(), 5000);
            }, 3000);
        }
        
        function handleInvalidLink() {
            spinner.style.display = 'none';
            title.textContent = '❌ Invalid Link';
            subtitle.textContent = 'This authentication link is not valid';

            const instructions = createElement('div', 'instructions');
            const instructionsTitle = document.createElement('strong');
            instructionsTitle.textContent = '🔄 What to do:';
            const steps = document.createElement('ol');
            [
                'Open the PasteCraft extension',
                'Request a new password reset link',
                'Check your email for the new link'
            ].forEach((step) => steps.appendChild(createElement('li', '', step)));
            instructions.append(instructionsTitle, steps);

            setContent(
                createElement('div', 'error', 'This link has expired or is invalid.'),
                instructions,
                createOpenExtensionButton('🚀 Open PasteCraft')
            );
        }
        
        function openExtension() {
            // Instead of navigating to extension URL (which gets blocked),
            // just show instructions to user
            alert('📋 To complete your password reset:\n\n1. Click the PasteCraft icon 📋 in your browser toolbar\n2. The password reset form will appear automatically\n3. Enter your new password and save\n\n✨ The extension is ready and waiting for you!');
        }
        
        function tryExtensionMessage(data) {
            // Try to send message to extension if possible
            if (typeof chrome !== 'undefined' && chrome.runtime) {
                try {
                    chrome.runtime.sendMessage(EXTENSION_ID, data, (response) => {
                        console.log('Extension response:', response);
                    });
                } catch (e) {
                    console.log('Could not communicate with extension:', e);
                }
            }
        }
    </script>
</body>
</html>
