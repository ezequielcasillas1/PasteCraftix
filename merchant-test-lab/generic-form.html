<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generic Form — Merchant Test Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="lab-header">
    <p><a href="index.html">← Test Lab hub</a></p>
    <h1>Generic multi-field form</h1>
    <p>Tag-like small inputs for generic platform preset</p>
  </header>

  <form class="lab-form" data-field="generic-form">
    <label>
      Field A
      <input type="text" data-field="generic-field-a" placeholder="Small field A" />
    </label>
    <label>
      Field B
      <input type="text" data-field="generic-field-b" placeholder="Small field B" />
    </label>
    <label>
      Field C
      <input type="text" data-field="generic-field-c" placeholder="Small field C" />
    </label>
    <label>
      Field D
      <input type="text" data-field="generic-field-d" placeholder="Small field D" />
    </label>
    <label>
      Field E
      <input type="text" data-field="generic-field-e" placeholder="Small field E" />
    </label>
    <label>
      Notes (large)
      <textarea data-field="generic-notes" rows="4" placeholder="Optional notes block"></textarea>
    </label>
    <button type="button" data-action="mock-save">Submit (mock)</button>
  </form>
</body>
</html>
