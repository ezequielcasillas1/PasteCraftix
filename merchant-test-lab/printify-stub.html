<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Printify Stub — Merchant Test Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="lab-header">
    <p><a href="index.html">← Test Lab hub</a></p>
    <h1>Printify product stub</h1>
    <p>Keywords/tags fields for platform preset testing</p>
  </header>

  <form class="lab-form" data-field="printify-product-form">
    <label>
      Product title
      <input type="text" data-field="printify-title" placeholder="Product title" />
    </label>
    <label>
      Tags / keywords
      <input type="text" data-field="printify-tags" placeholder="comma-separated keywords" />
    </label>
    <label>
      SEO description
      <textarea data-field="printify-seo-desc" rows="4" placeholder="Short SEO text"></textarea>
    </label>
    <fieldset>
      <legend>Variant options (stub)</legend>
      <input type="text" data-field="printify-variant-color" placeholder="Color option" />
      <input type="text" data-field="printify-variant-size" placeholder="Size option" />
    </fieldset>
    <button type="button" data-action="mock-save">Save product (mock)</button>
  </form>
</body>
</html>
