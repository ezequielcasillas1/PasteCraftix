<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redbubble Design Mock — Merchant Test Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-platform="redbubble">
  <header class="lab-header">
    <p><a href="index.html">← Test Lab hub</a></p>
    <h1>Redbubble design editor (mock)</h1>
    <p>15 tags × 39 characters</p>
  </header>

  <form class="lab-form" data-field="redbubble-design-form">
    <p class="lab-meta">Preset: Redbubble — max 15 tags × 39 chars</p>

    <label>
      Design title
      <input type="text" data-field="redbubble-title" placeholder="Design title" />
    </label>

    <fieldset>
      <legend>Tags</legend>
      <div class="tag-grid">
        <input type="text" data-field="redbubble-tag-1" maxlength="39" placeholder="Tag 1" aria-label="Tag 1" />
        <input type="text" data-field="redbubble-tag-2" maxlength="39" placeholder="Tag 2" aria-label="Tag 2" />
        <input type="text" data-field="redbubble-tag-3" maxlength="39" placeholder="Tag 3" aria-label="Tag 3" />
        <input type="text" data-field="redbubble-tag-4" maxlength="39" placeholder="Tag 4" aria-label="Tag 4" />
        <input type="text" data-field="redbubble-tag-5" maxlength="39" placeholder="Tag 5" aria-label="Tag 5" />
        <input type="text" data-field="redbubble-tag-6" maxlength="39" placeholder="Tag 6" aria-label="Tag 6" />
        <input type="text" data-field="redbubble-tag-7" maxlength="39" placeholder="Tag 7" aria-label="Tag 7" />
        <input type="text" data-field="redbubble-tag-8" maxlength="39" placeholder="Tag 8" aria-label="Tag 8" />
        <input type="text" data-field="redbubble-tag-9" maxlength="39" placeholder="Tag 9" aria-label="Tag 9" />
        <input type="text" data-field="redbubble-tag-10" maxlength="39" placeholder="Tag 10" aria-label="Tag 10" />
        <input type="text" data-field="redbubble-tag-11" maxlength="39" placeholder="Tag 11" aria-label="Tag 11" />
        <input type="text" data-field="redbubble-tag-12" maxlength="39" placeholder="Tag 12" aria-label="Tag 12" />
        <input type="text" data-field="redbubble-tag-13" maxlength="39" placeholder="Tag 13" aria-label="Tag 13" />
        <input type="text" data-field="redbubble-tag-14" maxlength="39" placeholder="Tag 14" aria-label="Tag 14" />
        <input type="text" data-field="redbubble-tag-15" maxlength="39" placeholder="Tag 15" aria-label="Tag 15" />
      </div>
    </fieldset>

    <label>
      Description
      <textarea data-field="redbubble-description" rows="4" placeholder="Design description"></textarea>
    </label>

    <button type="button" data-action="mock-save">Publish design (mock)</button>
  </form>
</body>
</html>
