<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PasteCraft Attachment Viewer</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f8fafc;
        color: #111827;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        background: white;
        border-bottom: 1px solid #e5e7eb;
      }
      .title {
        font-size: 14px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .btn {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        background: white;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
      }
      .btn-primary {
        border-color: #3b82f6;
        background: #eff6ff;
        color: #1d4ed8;
      }
      .container {
        padding: 14px;
      }
      .card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 14px;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        line-height: 1.45;
      }
      img {
        max-width: 100%;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        display: block;
      }
      a {
        color: #2563eb;
        text-decoration: underline;
        word-break: break-all;
      }
      .meta {
        margin: 0 0 10px 0;
        color: #6b7280;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title" id="viewerTitle">Attachment</div>
      <div class="actions">
        <button class="btn" id="closeBtn">Close</button>
        <button class="btn btn-primary" id="openBtn" style="display:none;">Open</button>
      </div>
    </div>
    <div class="container">
      <div class="card">
        <p class="meta" id="viewerMeta"></p>
        <div id="viewerBody"></div>
      </div>
    </div>
    <script src="attachment-viewer.js"></script>
  </body>
</html>
