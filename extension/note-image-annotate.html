<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PasteCraft · Image Annotate</title>
    <link rel="stylesheet" href="styles/clip-image-annotate.css" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #64748b;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }
      .pc-annotate-page-toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 13000;
        padding: 10px 14px;
        border-radius: 10px;
        background: #1e293b;
        border: 1px solid rgba(148, 163, 184, 0.35);
        font: 600 13px system-ui, sans-serif;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .pc-annotate-page-toast.is-visible { opacity: 1; }
      .pc-annotate-page-status {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #94a3b8;
        font: 600 14px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="pc-annotate-page-status" data-field="annotate-page-status">Loading image…</div>
    <div class="pc-annotate-page-toast" data-field="annotate-page-toast" aria-live="polite"></div>
    <script type="module" src="popup/features/notes/notes.image-annotate-page.js"></script>
  </body>
</html>
