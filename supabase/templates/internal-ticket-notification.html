<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Support Ticket - PasteCraft</title>
</head>
<body style="margin:0; padding:0; background-color:#1a202c; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif; -webkit-font-smoothing:antialiased;">
  
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#1a202c;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        
        <!-- Main Container -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%; background-color:#2d3748; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,0.4);">
          
          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); padding:24px 32px; border-radius:16px 16px 0 0;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td>
                    <span style="font-size:24px; margin-right:12px;">📋</span>
                    <span style="color:#ffffff; font-size:18px; font-weight:700;">PasteCraft Support</span>
                  </td>
                  <td align="right">
                    <span style="display:inline-block; padding:6px 12px; background-color:rgba(255,255,255,0.2); border-radius:20px; color:#ffffff; font-size:12px; font-weight:600; text-transform:uppercase;">{{TICKET_TYPE}}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          
          <!-- Alert Banner -->
          <tr>
            <td style="padding:0;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#4a5568;">
                <tr>
                  <td style="padding:12px 32px; text-align:center;">
                    <span style="color:#fbd38d; font-size:14px; font-weight:600;">🔔 New {{TICKET_TYPE}} Ticket</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          
          <!-- Body -->
          <tr>
            <td style="padding:32px;">
              
              <!-- User Info -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td style="padding:16px; background-color:#3d4a5c; border-radius:8px;">
                    <table width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="40" valign="top">
                          <div style="width:36px; height:36px; background-color:#667eea; border-radius:50%; text-align:center; line-height:36px; color:#ffffff; font-weight:700; font-size:16px;">{{USER_INITIAL}}</div>
                        </td>
                        <td style="padding-left:12px;">
                          <p style="margin:0 0 4px; color:#e2e8f0; font-size:15px; font-weight:600;">{{USER_EMAIL}}</p>
                          <p style="margin:0; color:#a0aec0; font-size:13px;">User ID: {{USER_ID}}</p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              
              <!-- Subject -->
              <p style="margin:0 0 8px; color:#a0aec0; font-size:12px; text-transform:uppercase; letter-spacing:0.5px;">Subject</p>
              <p style="margin:0 0 24px; color:#ffffff; font-size:18px; font-weight:600;">{{SUBJECT}}</p>
              
              <!-- Message -->
              <p style="margin:0 0 8px; color:#a0aec0; font-size:12px; text-transform:uppercase; letter-spacing:0.5px;">Message</p>
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td style="padding:16px; background-color:#1a202c; border-radius:8px; border-left:3px solid #667eea;">
                    <p style="margin:0; color:#e2e8f0; font-size:14px; line-height:1.7; white-space:pre-wrap;">{{DESCRIPTION}}</p>
                  </td>
                </tr>
              </table>
              
              <!-- Extra Fields -->
              <p style="margin:0 0 8px; color:#a0aec0; font-size:12px; text-transform:uppercase; letter-spacing:0.5px;">Additional Info</p>
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td style="padding:16px; background-color:#1a202c; border-radius:8px;">
                    <pre style="margin:0; color:#a0aec0; font-size:12px; font-family:monospace; white-space:pre-wrap;">{{EXTRA_FIELDS}}</pre>
                  </td>
                </tr>
              </table>
              
              <!-- User Agent -->
              <p style="margin:0 0 8px; color:#a0aec0; font-size:12px; text-transform:uppercase; letter-spacing:0.5px;">Browser / Device</p>
              <p style="margin:0; padding:12px; background-color:#1a202c; border-radius:8px; color:#718096; font-size:12px; font-family:monospace; word-break:break-all;">{{USER_AGENT}}</p>
              
            </td>
          </tr>
          
          <!-- Action Footer -->
          <tr>
            <td style="padding:24px 32px 32px; background-color:#1a202c; border-radius:0 0 16px 16px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center">
                    <a href="mailto:{{USER_EMAIL}}?subject=Re: {{SUBJECT}}" style="display:inline-block; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#ffffff; padding:12px 32px; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px;">
                      Reply to User
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:16px 0 0; text-align:center; color:#718096; font-size:12px;">
                Received: {{TIMESTAMP}}
              </p>
            </td>
          </tr>
          
        </table>
        
      </td>
    </tr>
  </table>
  
</body>
</html>
