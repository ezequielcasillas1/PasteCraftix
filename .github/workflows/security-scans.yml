name: Security Scans

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret,config

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep
        run: >-
          semgrep scan
          --config p/default
          --config p/javascript
          --config p/typescript
          --severity ERROR
          --error
          --metrics=off

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.24.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

  # Requires SNYK_TOKEN (long-lived API token). SNYK_OAUTH_TOKEN (~1h) is optional fallback only.
  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (all projects)
        run: npm ci && npm ci --prefix website

      - name: Verify Snyk credentials
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_OAUTH_TOKEN: ${{ secrets.SNYK_OAUTH_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ] && [ -z "$SNYK_OAUTH_TOKEN" ]; then
            echo "::error::No Snyk credentials. Set SNYK_TOKEN (recommended) — see docs/security/snyk-automation-setup.md"
            exit 1
          fi
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning::SNYK_TOKEN unset; using SNYK_OAUTH_TOKEN (expires ~1h). Prefer a long-lived API token."
          fi

      - name: Run Snyk vulnerability scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_OAUTH_TOKEN: ${{ secrets.SNYK_OAUTH_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects --json-file-output=snyk-results.json

      - name: Upload Snyk JSON report
        if: always() && hashFiles('snyk-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: snyk-results.json
          retention-days: 30
