name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prepare extension assets for CI
        run: |
          cp extension/config.example.js extension/config.js
          mkdir -p extension/lib/katex-fonts
          for f in marked.min.js purify.min.js highlight.min.js mermaid.min.js \
            pdf.min.js pdf.worker.min.js lucide.min.js katex.min.js; do
            touch "extension/lib/$f"
          done
          for f in highlight-github.min.css katex.min.css; do
            touch "extension/lib/$f"
          done

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  website:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  supabase-functions:
    name: Supabase functions (Deno)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check edge functions
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/functions/*/index.ts)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No supabase/functions/*/index.ts entrypoints; skipping."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Checking $f"
            deno check "$f"
          done
